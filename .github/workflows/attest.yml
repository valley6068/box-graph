# When a release is published, prove its main.js and manifest.json came from this repo
# (GitHub artifact attestation) and attach those exact files to the release.
name: Attest release files
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Manifest version must match the tag
        run: test "$(jq -r .version manifest.json)" = "$TAG"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
      - name: Attach the attested files to the release
        run: gh release upload "$TAG" main.js manifest.json --clobber
